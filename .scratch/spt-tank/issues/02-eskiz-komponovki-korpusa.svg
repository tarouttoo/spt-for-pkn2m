<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" font-family="Arial, DejaVu Sans, sans-serif">
  <rect width="1440" height="860" fill="#ffffff"/>

  <!-- ================= title ================= -->
  <text x="40" y="42" font-size="23" font-weight="bold" fill="#111">Корпус СПТ — эскиз компоновки (черновой артефакт для реакции)</text>
  <text x="40" y="68" font-size="13" fill="#4b5563">Продольный вид. Присоединения — в торцевые днища и на верхнюю/нижнюю образующую, как в РЭ СПТ (рис. 1, 3, 4).</text>
  <text x="40" y="86" font-size="13" fill="#4b5563">Начинка станции (ТЭН-блок, самовсасывающий фильтр, насос, арматура) — вне границ тикета, показана условно.</text>

  <!-- ================= floor ================= -->
  <line x1="40" y1="720" x2="1000" y2="720" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="1.2">
    <line x1="52" y1="720" x2="40" y2="734"/><line x1="82" y1="720" x2="70" y2="734"/><line x1="112" y1="720" x2="100" y2="734"/>
    <line x1="142" y1="720" x2="130" y2="734"/><line x1="172" y1="720" x2="160" y2="734"/><line x1="202" y1="720" x2="190" y2="734"/>
    <line x1="232" y1="720" x2="220" y2="734"/><line x1="262" y1="720" x2="250" y2="734"/><line x1="292" y1="720" x2="280" y2="734"/>
    <line x1="322" y1="720" x2="310" y2="734"/><line x1="352" y1="720" x2="340" y2="734"/><line x1="382" y1="720" x2="370" y2="734"/>
    <line x1="412" y1="720" x2="400" y2="734"/><line x1="442" y1="720" x2="430" y2="734"/><line x1="472" y1="720" x2="460" y2="734"/>
    <line x1="502" y1="720" x2="490" y2="734"/><line x1="532" y1="720" x2="520" y2="734"/><line x1="562" y1="720" x2="550" y2="734"/>
    <line x1="592" y1="720" x2="580" y2="734"/><line x1="622" y1="720" x2="610" y2="734"/><line x1="652" y1="720" x2="640" y2="734"/>
    <line x1="682" y1="720" x2="670" y2="734"/><line x1="712" y1="720" x2="700" y2="734"/><line x1="742" y1="720" x2="730" y2="734"/>
    <line x1="772" y1="720" x2="760" y2="734"/><line x1="802" y1="720" x2="790" y2="734"/><line x1="832" y1="720" x2="820" y2="734"/>
    <line x1="862" y1="720" x2="850" y2="734"/><line x1="892" y1="720" x2="880" y2="734"/><line x1="922" y1="720" x2="910" y2="734"/>
    <line x1="952" y1="720" x2="940" y2="734"/><line x1="982" y1="720" x2="970" y2="734"/>
  </g>

  <!-- ================= slope direction (free band above the right end; no crossing) ================= -->
  <line x1="836" y1="266" x2="1018" y2="253" stroke="#111" stroke-width="1.4"/>
  <path d="M1028,252 L1010,247 L1012,259 Z" fill="#111"/>
  <text x="1028" y="240" font-size="13" fill="#374151" text-anchor="end">уклон 30…50 мм (вверх к торцу B)</text>

  <!-- ================= legs ================= -->
  <path d="M378.3,518.6 L414.3,518.6 L442,720 L350,720 Z" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
  <rect x="342" y="720" width="104" height="10" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
  <path d="M777.4,491.0 L813.4,491.0 L841,720 L749,720 Z" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
  <rect x="741" y="720" width="104" height="10" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
  <text x="250" y="756" font-size="12" fill="#6b7280">лапы торца A (низкие)</text>
  <text x="690" y="756" font-size="12" fill="#6b7280">лапы торца B (выше на 30…50 мм)</text>
  <text x="455" y="700" font-size="12" fill="#6b7280">уклон — разновысотные лапы / прокладки</text>

  <!-- ================= vessel ================= -->
  <g transform="translate(300,430) rotate(-3.954)">
    <!-- insulation + jacket contour (ticket 03): offset from the shell and from the dished ends,
         closed, and broken only at real penetrations — connections 1…3 and the legs -->
    <line x1="0" y1="-113" x2="580" y2="-113" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="0" y1="113" x2="67" y2="113" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="110" y1="113" x2="468" y2="113" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="510" y1="113" x2="580" y2="113" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M0,-113 A62,113 0 0 0 -53.9,-56" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M-59.1,-34 A62,113 0 0 0 -51.8,62" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M-41.5,84 A62,113 0 0 0 0,113" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M580,-113 A62,113 0 0 1 641.5,-14" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M641.6,12 A62,113 0 0 1 580,113" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
    <ellipse cx="580" cy="0" rx="45" ry="95" fill="#eef1f4" stroke="#111" stroke-width="2.6"/>
    <ellipse cx="0"   cy="0" rx="45" ry="95" fill="#eef1f4" stroke="#111" stroke-width="2.6"/>
    <rect x="0" y="-95" width="580" height="190" fill="#eef1f4" stroke="#111" stroke-width="2.6"/>
    <line x1="0"   y1="-95" x2="0"   y2="95" stroke="#111" stroke-width="1.6"/>
    <line x1="580" y1="-95" x2="580" y2="95" stroke="#111" stroke-width="1.6"/>
    <line x1="-72" y1="0" x2="652" y2="0" stroke="#111" stroke-width="1" stroke-dasharray="14 4 3 4"/>

    <!-- nachinka: heaters, inserted from end B (right) -->
    <line x1="66" y1="56" x2="616" y2="56" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 5"/>
    <line x1="66" y1="70" x2="616" y2="70" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 5"/>
    <line x1="66" y1="84" x2="610" y2="84" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="180" y="45" font-size="12" fill="#2563eb">ТЭНы (начинка)</text>
    <!-- nachinka: self-priming filter — sits inside on the burner outlet (pos. 1):
         its lower-left corner lands on the inner end of nozzle 1, left edge follows the dish -->
    <path d="M-22,-82 L84,-82 L84,-38 L-40,-38 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="-14" y="-62" font-size="12" fill="#2563eb">фильтр</text>
    <text x="-14" y="-48" font-size="12" fill="#2563eb">(начинка)</text>

    <!-- pos.1 outlet to burner: nozzle in the end-A dish, upper part; filter sits on it -->
    <rect x="-100" y="-52" width="60" height="14" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
    <line x1="-100" y1="-45" x2="-160" y2="-45" stroke="#111" stroke-width="1.2"/>
    <path d="M-168,-45 l10,-5 l0,10 z" fill="#111"/>

    <!-- pos.2 drain: nozzle in the end-A dish, lower part (lowest point) -->
    <rect x="-100" y="66" width="70" height="14" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
    <rect x="-100" y="80" width="14" height="46" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
    <path d="M-100,126 L-86,126 L-93,140 Z" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <path d="M-100,154 L-86,154 L-93,140 Z" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <line x1="-93" y1="154" x2="-93" y2="172" stroke="#111" stroke-width="1.2"/>
    <path d="M-93,180 l-5,-10 l10,0 z" fill="#111"/>

    <!-- pos.3 filling from РЕ: nozzle in the end-B dish, at axis level -->
    <rect x="620" y="-8" width="42" height="14" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
    <line x1="662" y1="-1" x2="697" y2="-36" stroke="#111" stroke-width="1.2"/>
    <path d="M705,-44 L700,-32 L688,-44 Z" fill="#111"/>

    <!-- pos.4 flanged TЭН-block connection: end-B dish, lower part -->
    <rect x="610" y="42" width="20" height="54" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
    <rect x="630" y="30" width="86" height="78" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 5"/>
    <text x="660" y="132" font-size="12" fill="#2563eb">ТЭН-блок</text>

    <!-- pos.5 overflow: top generatrix, near end B -->
    <rect x="453" y="-150" width="14" height="55" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
    <path d="M453,-180 L467,-180 L460,-166 Z" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <path d="M453,-152 L467,-152 L460,-166 Z" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <line x1="460" y1="-180" x2="460" y2="-205" stroke="#111" stroke-width="1.2"/>
    <path d="M460,-213 l-5,10 l10,0 z" fill="#111"/>

    <!-- pos.6 air vent: top generatrix, highest point at end B -->
    <rect x="518" y="-160" width="14" height="65" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
    <path d="M518,-192 L532,-192 L525,-178 Z" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <path d="M518,-162 L532,-162 L525,-176 Z" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <line x1="525" y1="-192" x2="525" y2="-216" stroke="#111" stroke-width="1.2"/>
    <path d="M525,-224 l-5,10 l10,0 z" fill="#111"/>

    <!-- pos.7 thermometer well -->
    <line x1="250" y1="-95" x2="250" y2="-146" stroke="#111" stroke-width="7"/>
    <rect x="241" y="-154" width="18" height="9" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>

    <!-- pos.8 DTS well -->
    <line x1="190" y1="-95" x2="190" y2="-146" stroke="#111" stroke-width="7"/>
    <rect x="181" y="-154" width="18" height="9" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>

    <!-- pos.9 return line from burner: bottom generatrix, nearer end A -->
    <rect x="193" y="95" width="14" height="52" fill="#d3d8de" stroke="#111" stroke-width="1.6"/>
    <path d="M193,176 L207,176 L200,162 Z" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <path d="M193,148 L207,148 L200,162 Z" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <line x1="200" y1="176" x2="200" y2="195" stroke="#111" stroke-width="1.2"/>
    <path d="M200,101 l-5,11 l10,0 z" fill="#111"/>

    <!-- pos.10 earthing stud: on the shell beside leg A, clear of the leg silhouette -->
    <line x1="40" y1="95" x2="40" y2="126" stroke="#111" stroke-width="5"/>
    <line x1="28" y1="128" x2="52" y2="128" stroke="#111" stroke-width="3"/>
    <line x1="32" y1="135" x2="48" y2="135" stroke="#111" stroke-width="2.4"/>
    <line x1="36" y1="141" x2="44" y2="141" stroke="#111" stroke-width="1.8"/>
  </g>

  <!-- ================= annotations ================= -->
  <text x="16" y="402" font-size="13" fill="#374151">к горелке</text>
  <text x="836" y="150" font-size="13" fill="#374151">в атмосферу</text>
  <text x="706" y="152" font-size="13" fill="#374151" text-anchor="end">перелив</text>
  <text x="962" y="302" font-size="13" fill="#374151">из РЕ</text>
  <text x="566" y="606" font-size="13" fill="#374151">от горелки</text>

  <!-- ================= position badges ================= -->
  <g>
    <circle cx="170" cy="362" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="170" y="367" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">1</text>
    <circle cx="150" cy="600" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="150" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">2</text>
    <circle cx="938" cy="292" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="938" y="297" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">3</text>
    <circle cx="908" cy="548" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="908" y="553" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">4</text>
    <circle cx="744" cy="158" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="744" y="163" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">5</text>
    <circle cx="808" cy="145" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="808" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">6</text>
    <circle cx="539" cy="238" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="539" y="243" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">7</text>
    <circle cx="479" cy="242" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="479" y="247" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">8</text>
    <circle cx="546" cy="600" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="546" y="605" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">9</text>
    <circle cx="322" cy="604" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="322" y="609" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">10</text>
    <circle cx="340" cy="688" r="14" fill="#ffffff" stroke="#111" stroke-width="1.6"/><text x="340" y="693" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">11</text>
  </g>
  <g stroke="#111" stroke-width="1" fill="none">
    <line x1="170" y1="376" x2="196" y2="388"/>
    <line x1="150" y1="586" x2="208" y2="572"/>
    <line x1="938" y1="306" x2="938" y2="372"/>
    <line x1="908" y1="534" x2="918" y2="490"/>
    <line x1="744" y1="172" x2="748" y2="186"/>
    <line x1="808" y1="159" x2="812" y2="172"/>
    <line x1="539" y1="252" x2="539" y2="259"/>
    <line x1="479" y1="256" x2="479" y2="263"/>
    <line x1="546" y1="586" x2="520" y2="570"/>
    <line x1="322" y1="590" x2="344" y2="556"/>
    <line x1="340" y1="702" x2="360" y2="712"/>
  </g>

  <!-- ================= legend ================= -->
  <rect x="1060" y="70" width="360" height="770" rx="10" fill="#fafafa" stroke="#cbd5e1"/>
  <text x="1080" y="100" font-size="17" font-weight="bold" fill="#111">Позиции</text>
  <g font-size="13" fill="#374151">
    <text x="1080" y="132">1 — выход к горелке (в днище A), DN25</text>
    <text x="1080" y="160">2 — дренаж осадка (в днище A), DN15</text>
    <text x="1080" y="188">3 — заполнение из РЕ (в днище B), DN20</text>
    <text x="1080" y="216">4 — ответный фланец под ТЭН-блок (днище B)</text>
    <text x="1080" y="244">5 — перелив, DN20</text>
    <text x="1080" y="272">6 — воздухоотвод (связь с атмосферой), DN15</text>
    <text x="1080" y="300">7 — гильза термометра</text>
    <text x="1080" y="328">8 — гильза датчика ДТС</text>
    <text x="1080" y="356">9 — обратка от горелки (вниз), DN20</text>
    <text x="1080" y="384">10 — заземление (шпилька М12 — предложение)</text>
    <text x="1080" y="412">11 — опоры: 4 приварные лапы (2 + 2)</text>
  </g>
  <text x="1080" y="456" font-size="15" font-weight="bold" fill="#111">Примечания</text>
  <g font-size="12" fill="#6b7280">
    <text x="1080" y="482">• Фильтр стоит на выходе к горелке: поз. 1 —</text>
    <text x="1096" y="500">патрубок в днище торца A, самовсасывающий</text>
    <text x="1096" y="518">фильтр — изнутри на нём; снятие — через</text>
    <text x="1096" y="536">этот узел.</text>
    <text x="1080" y="562">• ТЭНы вставляются с торца B (поз. 4) и идут</text>
    <text x="1096" y="580">вдоль корпуса в нижней части.</text>
    <text x="1080" y="606">• Уклон 30…50 мм — по РЭ СПТ: выше торец</text>
    <text x="1096" y="624">со стороны крана отведения воздуха (B),</text>
    <text x="1096" y="642">ниже — со стороны выхода к горелке (A).</text>
    <text x="1080" y="668">• Пропорции, диаметр и длина условны:</text>
    <text x="1096" y="686">база ~70 л, габарит и толщина s — тикет 05.</text>
    <text x="1080" y="712">• Теплоизоляция и кожух (штриховые линии) — тикет 03;</text>
    <text x="1096" y="730">условно; торцы не замкнуты ради присоединений.</text>
    <text x="1080" y="756">• Связь с атмосферой (поз. 6) и перелив</text>
    <text x="1096" y="774">(поз. 5) — требования тикета 12.</text>
    <text x="1080" y="800">• Начинка вне границ тикета (map.md, «Out of</text>
    <text x="1096" y="818">scope»); показана условно.</text>
  </g>
</svg>
